name: PEP-8 Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PEP-8 check
        run: |
              echo "Start checking the code"
              python -m pycodestyle scripts/position_commads.py
              if [ $? -eq 0 ]; then
                echo "Everything is fine with"
              else
                echo "Some errors with PEP-8"
                exit 1
              fi
              echo "Check completed"
